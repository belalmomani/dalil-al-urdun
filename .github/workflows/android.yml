name: Android (اختبار وبناء APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # اختياري: ملف Firebase يأتي من سر GitHub (GOOGLE_SERVICES_JSON_BASE64) ولا يُحفظ في المستودع.
      - name: إعداد google-services.json (إن وُجد السر)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > app/google-services.json
            echo "تم إنشاء google-services.json من السر."
          else
            echo "لا يوجد سر Firebase: سيُبنى التطبيق في وضع البيانات التجريبية."
          fi

      # اختياري: مفتاح التوقيع من الأسرار (KEYSTORE_BASE64, KEYSTORE_PASSWORD) ليكون التوقيع ثابتًا.
      - name: إعداد مفتاح التوقيع (إن وُجد السر)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dalil.keystore"
            echo "::add-mask::$KS_PASS"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/dalil.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=dalil" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          fi

      - name: اختبارات الوحدة
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: بناء APK تجريبي
        env:
          # فارغ = الإعلانات معطلة. ضع STARTIO_APP_ID في Secrets بعد حصولك على المعرّف.
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dalil-al-urdun-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
